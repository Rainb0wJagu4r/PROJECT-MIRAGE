[workspace]
resolver = "2"
members = [
    "crates/mirage-core",
    "crates/mirage-cli",
    "crates/mirage-gui",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
authors = ["Project Mirage Contributors"]
license = "MIT"
repository = "https://github.com/Rainb0wJagu4r/PROJECT-MIRAGE"
description = "Project Mirage: Armored Symmetric Cryptosystem (Mirage-C4 v2) & Vault Engine in Rust"

[workspace.dependencies]
scrypt = { version = "0.11", default-features = false }
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
camellia = "0.1"
aria = "0.1"
chacha20 = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
zeroize = { version = "1.8", features = ["derive", "alloc"] }
subtle = "2.6"
rand = "0.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
colored = "3.0"
