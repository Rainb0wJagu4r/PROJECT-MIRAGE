[package]
name = "mirage-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Native Rust Cyberpunk GUI for Project Mirage (100% Memory-Safe, Zero JavaScript/NPM)"

[[bin]]
name = "mirage-gui"
path = "src/main.rs"

[dependencies]
mirage-core = { path = "../mirage-core" }
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rfd = "0.15"
sha3 = "0.10"
hex = "0.4"
zeroize = "1.9"
