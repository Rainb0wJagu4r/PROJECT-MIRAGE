[package]
name = "project-mirage-tauri"
version = "2.2.0"
description = "Project Mirage — Tauri v2 Armored Cryptographic Desktop Vault"
authors = ["Project Mirage Contributors"]
edition = "2021"

[lib]
name = "project_mirage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }

[dependencies]
tauri = { version = "2.0", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mirage-core = { path = "../crates/mirage-core" }
sha3 = "0.10"
hex = "0.4"
rfd = "0.15"
zeroize = "1.9"
